[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bakeoff"]

[project]
name = "bakeoff"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "timm", "numpy", "pandas", "lightning>=2.4", "pyyaml"]

[project.optional-dependencies]
geo = ["torchgeo"]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
